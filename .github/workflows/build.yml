name: Build WalletTrack V2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check (tsc)
        run: npm run lint

      - name: Build web (Vite)
        run: npm run build

      - name: Install imagemagick
        run: sudo apt-get install -y imagemagick

      - name: Remove existing android folder if present
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      # ── F1.1 · El google-services.json del proyecto Firebase ──
      # (baja de la console del fittrack-e06be, incluye la app
      # com.wallettrack.app). Mismo paso que el CI del FitTrack V2.
      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: F1.1 · Versionar APK (versionCode 3 · versionName 1.1.1)
        run: |
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode 1/versionCode 3/' "$GRADLE"
          sed -i 's/versionName "1.0"/versionName "1.1.1"/' "$GRADLE"
          echo "✅ versionCode 3 · versionName 1.1.1"
          grep -E "versionCode|versionName" "$GRADLE" || true

      # ── F1.1 · GOOGLE LOGIN (patrón exacto del FitTrack V2) ────
      # FIX de "Plugin nativo no disponible": el plugin lee su
      # clientId de capacitor.config.json (plugins.GoogleAuth con
      # scopes) — sin scopes el load() del plugin truena y Capacitor
      # lo dropea (todo da "not implemented"). El strings.xml queda
      # como respaldo. Reutilizamos el MISMO proyecto Firebase del
      # FitTrack (fittrack-e06be): su web client (client_type 3)
      # sirve para todas las apps del proyecto. Falta solo registrar
      # el SHA-1 de esta app en Firebase Console — paso del LEEME.
      - name: F1 · Configurar GoogleAuth (strings.xml + server_client_id)
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">WalletTrack</string><string name="title_activity_main">WalletTrack</string><string name="package_name">com.wallettrack.app</string><string name="custom_url_scheme">com.wallettrack.app</string><string name="server_client_id">202098578518-0b5e3vcnv4ark4955k3ek5gjl9eeoct8.apps.googleusercontent.com</string></resources>' > android/app/src/main/res/values/strings.xml
          echo "✅ strings.xml con server_client_id del proyecto fittrack-e06be"

      - name: F1 · Agregar dependencia play-services-auth (Google nativo)
        run: |
          GRADLE="android/app/build.gradle"
          sed -i '/dependencies {/a\    implementation "com.google.android.gms:play-services-auth:20.7.0"' "$GRADLE"
          grep -n "play-services-auth" "$GRADLE" || true

      - name: 🔔 Generar iconos HD (mismo proceso del FitTrack V2)
        run: |
          if [ -f "icon.png" ]; then
            echo "📐 Tamaño del icon.png original:"
            identify icon.png

            # Iconos launcher nítidos con Lanczos + unsharp
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi)    size=48  ;;
                hdpi)    size=72  ;;
                xhdpi)   size=96  ;;
                xxhdpi)  size=144 ;;
                xxxhdpi) size=192 ;;
              esac
              dir="android/app/src/main/res/mipmap-${density}"
              mkdir -p "$dir"
              convert icon.png -resize ${size}x${size}\! -filter Lanczos -quality 100 -unsharp 0x0.5 "${dir}/ic_launcher.png"
              convert icon.png -resize ${size}x${size}\! -filter Lanczos -quality 100 -unsharp 0x0.5 "${dir}/ic_launcher_round.png"
              echo "  ✅ ${density}: ${size}x${size}"
            done

            # Foreground para adaptive icons (Android 8+)
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi)    fg=108 ;;
                hdpi)    fg=162 ;;
                xhdpi)   fg=216 ;;
                xxhdpi)  fg=324 ;;
                xxxhdpi) fg=432 ;;
              esac
              dir="android/app/src/main/res/mipmap-${density}"
              convert icon.png -resize $((fg*70/100))x$((fg*70/100)) -filter Lanczos -quality 100 -unsharp 0x0.5 -gravity center -background none -extent ${fg}x${fg} "${dir}/ic_launcher_foreground.png"
            done

            # Adaptive icons XML (Android 8+)
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

            # Fondo del adaptive icon: negro (combina con el icono original)
            mkdir -p android/app/src/main/res/values
            rm -f android/app/src/main/res/values/ic_launcher_background.xml
            rm -f android/app/src/main/res/values/colors.xml
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>' > android/app/src/main/res/values/colors.xml

            echo "✅ Todos los iconos generados en HD con unsharp mask"
          else
            echo "⚠️ No hay icon.png, usando iconos default"
          fi

      - name: Generar splash real (logo centrado, fondo del tema)
        run: |
          if [ -f "icon.png" ]; then
            # Splash: logo centrado (~35%) sobre el fondo #020617 del tema.
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi)    size=480  ;;
                hdpi)    size=720  ;;
                xhdpi)   size=960  ;;
                xxhdpi)  size=1440 ;;
                xxxhdpi) size=1920 ;;
              esac
              dir="android/app/src/main/res/drawable-${density}"
              mkdir -p "$dir"
              convert icon.png -resize $((size*35/100)) -filter Lanczos -quality 100 \
                -gravity center -background '#020617' -extent ${size}x${size} "${dir}/splash.png"
              echo "  ✅ splash ${density}: ${size}x${size}"
            done
            mkdir -p android/app/src/main/res/drawable
            convert icon.png -resize 336 -filter Lanczos -quality 100 \
              -gravity center -background '#020617' -extent 960x960 "android/app/src/main/res/drawable/splash.png"
            echo "✅ Splash generado en todas las densidades"
          else
            echo "⚠️ No hay icon.png, usando splash default de Capacitor"
          fi

      - name: Update AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <application|' "$MANIFEST"

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── KEYSTORE COMPATIBLE CON LA APP VIEJA ─────────────────
      # Usa el MISMO keystore del repo wallettrack.github.io:
      # copia el secret KEYSTORE_BASE64 de ese repo acá y el APK V2
      # instala ENCIMA de la app ya instalada (mismo appId
      # com.wallettrack.app + misma firma → tus datos sobreviven).
      # Si no existe todavía, lo genera y muestra el base64.
      - name: Restore or generate keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "✅ Usando keystore guardado en Secrets (firma idéntica a la app vieja)"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "⚠️ No hay KEYSTORE_BASE64 — generando uno nuevo (guárdalo después como Secret)"
            keytool -genkeypair \
              -keystore release.keystore \
              -alias wallettrack \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass wallettrack123 \
              -keypass wallettrack123 \
              -dname "CN=WalletTrack, OU=Dev, O=WalletTrack, L=Lima, S=Lima, C=PE"
            echo ""
            echo "══════════════════════════════════════════════"
            echo "COPIA ESTE BASE64 Y GUÁRDALO EN GITHUB SECRETS"
            echo "Nombre del secret: KEYSTORE_BASE64"
            echo "══════════════════════════════════════════════"
            base64 -w 0 release.keystore
            echo ""
            echo "══════════════════════════════════════════════"
          fi

      # ── F1 · SHA-1 DEL KEYSTORE ─────────────────────────────
      # Google Sign-In en Android exige registrar en Firebase
      # Console el SHA-1 de la firma del APK. Este paso lo imprime
      # en el log para copiarlo y pegarlo en la consola de
      # fittrack-e06be (app Android com.wallettrack.app).
      - name: F1.1 · Imprimir SHA-1 del keystore (para Firebase Console)
        run: |
          STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          if [ -z "$STORE_PASS" ]; then STORE_PASS="wallettrack123"; fi
          echo "════════════════════════════════════════════════"
          echo "SHA-1 PARA REGISTRAR EN FIREBASE CONSOLE"
          echo "(proyecto fittrack-e06be → app Android"
          echo " com.wallettrack.app → Huella digital SHA-1)"
          echo "════════════════════════════════════════════════"
          keytool -list -v -keystore release.keystore -alias wallettrack -storepass "$STORE_PASS" 2>/dev/null | grep -E "SHA1:|SHA256:" || echo "⚠️ keytool no pudo leer el keystore"
          echo "════════════════════════════════════════════════"

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name "zipalign" | head -1)
          $ZIPALIGN -v -p 4 android/app/build/outputs/apk/debug/app-debug.apk WalletTrack-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" | head -1)
          STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$STORE_PASS" ]; then STORE_PASS="wallettrack123"; echo "⚠️ STORE_PASSWORD no configurado — usando clave temporal del viejo"; fi
          if [ -z "$KEY_PASS" ]; then KEY_PASS="wallettrack123"; echo "⚠️ KEY_PASSWORD no configurado — usando clave temporal del viejo"; fi
          $APKSIGNER sign --ks release.keystore --ks-key-alias wallettrack --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out WalletTrack-V2-F1.1.apk WalletTrack-aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WalletTrack-V2-APK
          path: WalletTrack-V2-F1.1.apk
          retention-days: 30

      - name: Show APK info
        run: du -sh WalletTrack-V2-F1.1.apk
